name: Browser regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-chrome-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Run isolated browser regression
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test.ps1 -Browser
