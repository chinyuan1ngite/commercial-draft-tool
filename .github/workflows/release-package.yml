name: Release package validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and build dependencies
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-build.txt
          python -m pip check
      - name: Run release build and validation
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: Commercial1688DraftTool-windows
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
