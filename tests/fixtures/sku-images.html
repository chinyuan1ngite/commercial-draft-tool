<!doctype html>
<html><body>
<div id="guid-skuTable"><table data-codex-sku-table="1"><tbody></tbody></table></div>
<template id="picker-template">
  <ul><li class="tab-album">Album</li><li class="tab-upload">Upload</li></ul>
  <input type="file"><input class="album-search"><input class="album-btn" type="button" value="Search">
  <div id="progress"></div><div id="album"></div>
  <ul class="insert-pool"></ul><div class="ib-footer action"><button class="button submit">Insert</button></div>
  <script>
    const pool = document.querySelector('.insert-pool');
    let successes = parent.options.staleCount || 0;
    const progress = () => document.querySelector('#progress').textContent = '\u4e0a\u4f20\u6210\u529f ' + successes + ' \u5f20';
    function select(record) {
      const li = document.createElement('li'), image = document.createElement('img'), remove = document.createElement('button');
      image.src = record.src; image.alt = record.title; remove.className = 'remove'; remove.textContent = 'Remove';
      remove.onclick = () => li.remove(); li.append(image, remove); pool.append(li);
    }
    function render() {
      const album = document.querySelector('#album'); album.replaceChildren();
      const query = document.querySelector('.album-search').value;
      parent.records.filter(record => record.title.includes(query)).forEach(record => {
        const link = document.createElement('a'), image = document.createElement('img');
        link.title = record.title; link.dataset.id = record.id; image.src = record.src;
        image.alt = record.title; link.append(image); link.onclick = () => {
          select(record); if (parent.options.extraSelection) select(parent.options.extraSelection);
        }; album.append(link);
      });
    }
    document.querySelector('input').onchange = function() {
      parent.uploads++; const file = this.files[0]; const reader = new FileReader();
      if (parent.options.networkUpload) {
        const form = new FormData(); form.append('file', file, parent.options.wrongFilename ? 'other.png' : file.name);
        fetch('https://picman.1688.com/album/ajax/image_upload_ajax.json?_input_charset=UTF-8', {
          method: 'POST', body: form,
        }).then(r => r.json()).then(result => {
          successes++; progress();
          const record = {title: file.name, src: result.miniImgUrls[0], id: String(result.dataList[0])};
          parent.records.push(record);
          select(parent.options.wrongPool || record);
          if (parent.options.extraSelection) select(parent.options.extraSelection);
          render();
        });
        return;
      }
      reader.onload = () => setTimeout(() => {
        if (parent.options.stall) return;
        successes++; progress();
        setTimeout(() => {
          if (parent.options.omitAlbumRecord) return;
          const title = parent.options.titleLimit ? file.name.slice(0, parent.options.titleLimit) : file.name;
          parent.records.push({title,src:parent.options.corrupt || reader.result,id:'uploaded-'+parent.uploads});
          render();
        }, parent.options.albumDelay || 0);
      }, parent.options.delay || 0); reader.readAsDataURL(file);
    };
    document.querySelector('.album-btn').onclick = render;
    document.querySelector('.submit').onclick = () => {
      parent.commits++; const images = [...pool.querySelectorAll('img')];
      parent.commit(parent.activeSku, images.map(image => image.src));
      parent.document.querySelector('.ibank-picker-dialog').remove();
    };
    if (parent.options.staleSelection) select(parent.options.staleSelection);
    progress(); render();
  </script>
</template>
<script>
  window.options = {}; window.records = []; window.uploads = 0; window.commits = 0;
  window.setup = (options, records, skus) => {
    window.options = options; window.records = records;
    const body = document.querySelector('tbody'); body.replaceChildren();
    skus.forEach(sku => {
      const row = document.createElement('tr'), cell = document.createElement('td'); row.dataset.skuId = sku;
      if (options.direct) {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = () => {window.uploads++; const reader = new FileReader();
          reader.onload = () => commit(sku,[options.corrupt || reader.result]); reader.readAsDataURL(input.files[0]);}; cell.append(input);
      } else {
        const add = document.createElement('button'); add.className = 'sku-picture-content'; add.textContent = 'Add';
        add.onclick = () => openPicker(sku); cell.append(add);
      }
      row.append(cell); body.append(row);
    });
  };
  window.commit = (sku, sources) => {
    const row = [...document.querySelectorAll('tbody tr')].find(row => row.dataset.skuId === sku);
    row.querySelectorAll('img').forEach(image => image.remove());
    sources.forEach(src => {const image = document.createElement('img'); image.src = src; row.querySelector('td').append(image);});
    if (options.recreate) {const fresh = row.cloneNode(true); fresh.removeAttribute('data-codex-image-row'); row.replaceWith(fresh);}
  };
  window.openPicker = sku => {
    activeSku = sku; const dialog = document.createElement('div'); dialog.className = 'ibank-picker-dialog';
    const close = document.createElement('button'); close.className = 'close'; close.textContent = 'Close'; close.onclick = () => dialog.remove();
    const frame = document.createElement('iframe'); frame.className = 'picker-frame'; frame.style.cssText = 'width:600px;height:400px';
    frame.srcdoc = document.querySelector('#picker-template').innerHTML; dialog.append(close,frame); document.body.append(dialog);
  };
</script>
</body></html>
