[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "commercial-1688-draft-tool"
version = "0.4.13"
description = "Draft-only 1688 collection and seller workflow"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "DrissionPage>=4.1.0.18,<5",
  "Pillow>=10,<12"
]

[project.scripts]
draft-tool = "draft_tool.cli:main"
draft-collect = "draft_tool.collector:main"
commercial-draft-launcher = "draft_tool.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
